name: CICD
on: push

jobs:
 buildjob:
  runs-on: ubuntu-latest
  steps:
   - name: checkout 
     uses: actions/checkout@v4
   - name: Setup nodejs
     uses: actions/setup-node@v4
     with: 
        node-version: 14
   - name: Run install
     run: npm install
   - name: Install dependencies
     run: npm ci
   - name: build
     run: npm run build
   - name: Deploy
     run: npm run deploy
     if: github.ref == 'refs/head/main' && github.event_name == 'push'
