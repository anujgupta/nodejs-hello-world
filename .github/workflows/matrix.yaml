name: matrix example
on:
 push:
  branches: 
   - main

jobs:
 buildjob: 
  strategy:
    matrix: 
     os: [ununtu-20.4, ubuntu-22.4 ]
     node: [18,20]
  runs-on: ${{ matrix.os }}
  steps:
   - name: checkout 
     uses: actions/checkout@v4
   - name: Setup nodejs
     uses: actions/setup-node@v4
     with: 
        node-version: ${{ matrix.node }}
   - name: Run install
     run: npm install
   - name: Install dependencies
     run: npm ci
   - name: build
     run: npm run build
   
